conditioning:
  method: ps
  params:
    scale: 0.3

data:
  name: ffhq
  root: ./data/samples/

measurement:
  operator:
    name: super_resolution_soc
    in_shape: !!python/tuple [1, 3, 256, 256]
    scale_factor: 4

  scale:
    linear: 0.7    # 0.7
    nonlinear: 0.7
    nonlinear_finitegamma: 0.7

  mcmc:
    param:
      'tau': 0.01
      'lr_min_ratio': 0.01
      'prior_solver': 'gaussian'
      'mc_algo': 'langevin'
    nonlinear: 
      'num_steps': 150
      'lr': 0.00005
    nonlinear_finitegamma:
      1000:
        'num_steps': 200
        'lr': 0.00005
      100000:
        'num_steps': 300
        'lr': 0.00005
      10000000:
        'num_steps': 200
        'lr': 0.00005

  noise: 
    name: gaussian
    sigma: 0.05