conditioning:
  method: ps
  params:
    scale: 0.3

data:
  name: ffhq
  root: ./data/samples/

measurement:
  operator:
    name: nonlinear_blur_soc
    opt_yml_path: ./bkse/options/generate_blur/default.yml

  scale:
    linear: 0.7
    nonlinear: 0.8
    nonlinear_finitegamma: 0.7

  mcmc:
    param:
      'tau': 0.01
      'lr_min_ratio': 0.01
      'prior_solver': 'gaussian'
      'mc_algo': 'langevin'
    nonlinear: 
      'num_steps': 200
      'lr': 0.00001
    nonlinear_finitegamma:
      1000:
        'num_steps': 200
        'lr': 0.000005
      100000:
        'num_steps': 200
        'lr': 0.000005
      10000000:
        'num_steps': 200
        'lr': 0.000005
    
    

  noise: 
    name: gaussian
    sigma: 0.05
