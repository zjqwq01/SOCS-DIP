conditioning:
  method: ps
  params:
    scale: 0.3

data:
  name: ffhq
  root: 
    ffhq: ./data/ffhq/val_100/
    imagenet: ./data/imagenet/imagenet_val100/

measurement:
  operator:
    name: motion_blur_soc
    kernel_size: 61
    intensity: 0.5

  scale:
    linear: 0.7
    nonlinear: 0.7
    nonlinear_finitegamma: 0.7

  mcmc:
    param:
      'tau': 0.01
      'lr_min_ratio': 0.01
      'prior_solver': 'gaussian'
      'mc_algo': 'langevin'
    nonlinear: 
      'num_steps': 100
      'lr': 0.00005
    nonlinear_finitegamma:
      1000:
        'num_steps': 200
        'lr': 0.0005
      100000:
        'num_steps': 200
        'lr': 0.000005
      10000000:
        'num_steps': 200
        'lr': 0.00000005
      1000000000:
        'num_steps': 200
        'lr': 0.0000000005

  noise: 
    name: gaussian
    sigma: 0.05
