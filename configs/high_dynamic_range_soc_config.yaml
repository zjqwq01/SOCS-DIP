conditioning:
  method: ps
  params:
    scale: 0.3

data:
  name: ffhq
  root: 
    ffhq: ./data/ffhq/val_10/
    imagenet: ./data/imagenet/imagenet_val100/

measurement:
  operator:
    name: high_dynamic_range_soc
    scale: 2

  mcmc:
    param:
      'tau': 0.01
      'lr_min_ratio': 0.01
      'prior_solver': 'gaussian'
      'mc_algo': 'langevin'
    nonlinear: 
      'num_steps': 300
      'lr': 0.00007
    nonlinear_finitegamma:
      1000:
        'num_steps': 300
        'lr': 0.00005
      100000:
        'num_steps': 300
        'lr': 0.0000005
      10000000:
        'num_steps': 300
        'lr': 0.000000005
      1000000000:
        'num_steps': 300
        'lr': 0.00000000005
              
  
  noise: 
    name: gaussian
    sigma: 0.05