conditioning:
  method: ps
  params:
    scale: 0.5

data:
  name: ffhq
  root: 
    ffhq: ./data/ffhq/val_100/
    imagenet: ./data/imagenet/imagenet_val100/

measurement:
  operator:
    name: super_resolution_inpainting_soc
    in_shape: !!python/tuple [1, 3, 256, 256]
    scale_factor: 4
  mask_opt:
    mask_type: random
    mask_prob_range: !!python/tuple [0.3, 0.7]
    image_size: 256


  mcmc:
    param:
      'tau': 0.01
      'lr_min_ratio': 0.01
      'prior_solver': 'gaussian'
      'mc_algo': 'langevin'
    nonlinear: 
      'num_steps': 150
      'lr': 0.00005
    nonlinear_finitegamma:
      1000:
        'num_steps': 150
        'lr': 0.0005
      100000:
        'num_steps': 150
        'lr': 0.000005
      10000000:
        'num_steps': 150
        'lr': 0.00000005
      1000000000:
        'num_steps': 150
        'lr': 0.0000000005


  noise:
    name: gaussian
    sigma: 0.05
